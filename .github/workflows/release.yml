name: Build and Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check source syntax
        run: python -m py_compile "媒体播放器_最终版_串联播放_录音版.py"
      - name: Build Windows executable
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onefile
          --name MediaConsole --icon iii.png --add-data "iii.png;."
          --hidden-import yt_dlp --hidden-import googleapiclient
          "媒体播放器_最终版_串联播放_录音版.py"
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/MediaConsole.exe
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MediaConsole.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
